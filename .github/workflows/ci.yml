name: CI

on:
  push:
    branches: [main]
  pull_request:
  
env:
  PYTHONUTF8: "1"
  
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Ставим только typer+rich: dry-run обязан работать без keyboard/pyperclip
      - name: Install
        run: pip install typer rich

      - name: Version
        run: python -m tgmsg --version

      - name: Help
        run: python -m tgmsg --help

      - name: Dry-run smoke test
        run: python -m tgmsg --dry-run -n 3 --delay 0.01 -t "ci test"

      - name: No-tty guard (must fail cleanly, exit 2)
        shell: bash
        run: |
          if python -m tgmsg; then
            echo "ОШИБКА: без --text и терминала должен быть отказ"; exit 1
          else
            echo "ок: чистый отказ без терминала"
          fi
